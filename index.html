<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TripNote">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>TripNote</title>

<style>
:root{
  --bg:#f6f7f9;
  --card:#fff;
  --text:#15171a;
  --muted:#7b818a;
  --line:#e8ebef;
  --accent:#1f6feb;
  --soft:#eaf2ff;
  --ok:#128a4b;
  --warn:#b26b00;
  --danger:#d93025;
  --shadow:0 8px 28px rgba(20,24,31,.06);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

.app{
  max-width:760px;
  margin:auto;
  padding:
    calc(env(safe-area-inset-top) + 10px)
    16px
    calc(env(safe-area-inset-bottom) + 96px);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:4px 2px 14px;
}

.brand{
  font-size:24px;
  font-weight:850;
}

.iconbtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:#fff;
  box-shadow:var(--shadow);
  font-size:20px;
}

.hero,.card{
  background:#fff;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.hero{
  border-radius:26px;
  padding:20px;
  background:linear-gradient(145deg,#fff,#f8fbff);
}

.card{
  border-radius:20px;
}

.eyebrow{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
  letter-spacing:.08em;
}

.title{
  font-size:29px;
  font-weight:850;
  line-height:1.15;
  margin:6px 0 8px;
}

.meta{
  font-size:14px;
  color:var(--muted);
  display:flex;
  flex-wrap:wrap;
  gap:8px 12px;
}

.count{
  display:flex;
  align-items:end;
  gap:10px;
  margin-top:18px;
}

.countnum{
  font-size:44px;
  font-weight:900;
  line-height:.95;
}

.countlabel{
  font-size:14px;
  color:var(--muted);
  padding-bottom:5px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:14px;
}

.stat{
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  background:#fff;
}

.sl{
  font-size:12px;
  color:var(--muted);
  font-weight:800;
}

.sv{
  font-size:22px;
  font-weight:850;
  margin-top:5px;
}

.progress{
  height:8px;
  background:#edf0f4;
  border-radius:99px;
  overflow:hidden;
  margin-top:10px;
}

.progress>div{
  height:100%;
  background:var(--accent);
  border-radius:99px;
}

.sec{
  margin-top:18px;
}

.sech{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:0 2px 10px;
}

.sect{
  font-size:17px;
  font-weight:850;
}

.link{
  border:0;
  background:transparent;
  color:var(--accent);
  font-weight:800;
}

.timeline{
  overflow:hidden;
}

.event{
  display:grid;
  grid-template-columns:62px 32px 1fr;
  gap:6px;
  padding:14px 16px;
}

.event+.event,
.item+.item{
  border-top:1px solid var(--line);
}

.time{
  font-size:13px;
  font-weight:850;
  padding-top:3px;
}

.eico{
  width:28px;
  height:28px;
  border-radius:10px;
  background:var(--soft);
  display:grid;
  place-items:center;
}

.et{
  font-size:15px;
  font-weight:850;
}

.es{
  font-size:13px;
  color:var(--muted);
  margin-top:3px;
}

.list{
  overflow:hidden;
}

.item{
  padding:15px 16px;
  display:flex;
  align-items:center;
  gap:12px;
}

.lico{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#f2f5f8;
  display:grid;
  place-items:center;
  font-size:20px;
}

.main{
  flex:1;
  min-width:0;
}

.it{
  font-size:15px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.is{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.amt{
  font-weight:850;
}

.tag{
  padding:5px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:850;
  background:#f0f2f5;
}

.tag.ok{
  background:#e8f7ef;
  color:var(--ok);
}

.tag.wait{
  background:#fff4df;
  color:var(--warn);
}

.empty{
  padding:28px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
}

.view{
  display:none;
}

.view.active{
  display:block;
}

.day{
  margin-top:10px;
  overflow:hidden;
}

.dayh{
  padding:14px 16px;
  background:#fbfcfd;
  border-bottom:1px solid var(--line);
  font-weight:850;
}

.fab{
  position:fixed;
  right:max(18px,calc((100vw - 760px)/2 + 18px));
  bottom:calc(env(safe-area-inset-bottom) + 84px);
  width:56px;
  height:56px;
  border:0;
  border-radius:18px;
  background:var(--accent);
  color:#fff;
  font-size:28px;
  box-shadow:0 10px 30px rgba(31,111,235,.28);
  z-index:30;
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(100%,760px);
  display:grid;
  grid-template-columns:repeat(6,1fr);
  padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  z-index:25;
}

.nav button{
  border:0;
  background:transparent;
  color:#8a9098;
  padding:8px 2px;
  font-size:11px;
  font-weight:800;
}

.nav .ico{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.nav button.active{
  color:var(--accent);
}

.sheet{
  position:fixed;
  inset:0;
  background:rgba(15,17,20,.36);
  display:none;
  align-items:flex-end;
  z-index:50;
}

.sheet.open{
  display:flex;
}

.panel{
  width:min(100%,760px);
  max-height:92vh;
  margin:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:12px 18px calc(env(safe-area-inset-bottom) + 20px);
  overflow:auto;
}

.grab{
  width:42px;
  height:5px;
  border-radius:99px;
  background:#d9dde3;
  margin:0 auto 14px;
}

.sht{
  font-size:20px;
  font-weight:900;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:850;
  color:#525860;
}

input,select,textarea{
  width:100%;
  border:1px solid #dfe3e8;
  border-radius:14px;
  padding:13px 14px;
  background:#fff;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.btn{
  flex:1;
  border:0;
  border-radius:15px;
  padding:14px;
  font-weight:850;
}

.primary{
  background:var(--accent);
  color:#fff;
}

.secondary{
  background:#f1f3f6;
}

.danger{
  background:#fdeceb;
  color:var(--danger);
}

.check{
  display:flex;
  align-items:center;
  gap:10px;
}

.check input{
  width:22px;
  height:22px;
}

.small{
  font-size:12px;
}

.muted{
  color:var(--muted);
}

.syncpill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:800;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  padding:6px 9px;
  border-radius:999px;
}

.syncdot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#c7ccd3;
}

.syncdot.ok{
  background:var(--ok);
}

.syncdot.busy{
  background:#f0a000;
}

.syncdot.err{
  background:var(--danger);
}

.trip-switch{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.trip-switch select{
  padding:9px 12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
  font-weight:800;
  max-width:250px;
}

.trip-card{
  cursor:pointer;
}

.trip-card .item{
  align-items:flex-start;
}

.trip-date{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

.trip-badge{
  font-size:11px;
  font-weight:850;
  padding:5px 9px;
  border-radius:999px;
  background:#eef2f7;
}

@media(min-width:650px){
  .stats{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">

    <div>

      <div class="brand">
        TripNote
      </div>

      <div class="syncpill">
        <span
          class="syncdot"
          id="syncDot">
        </span>

          接続中…

      </div>

    </button>

  旅程

</button>

<button data-view="booking">

  予約

</button>

<button data-view="expense">

  <span class="ico">¥</span>

</button>

    </div>

  </div>

</div>


<script>

const STORAGE_KEY=
  'tripnote_workspace_v3';

const OLD_KEY=
  'tripnote_data_v1';

const SYNC_CREDENTIALS_KEY=
  'tripnote_sync_credentials_v2';


function clone(x){

  return JSON.parse(
    JSON.stringify(x)
  );

}


function nid(){

  return (
    Date.now()+
    Math.floor(
      Math.random()*1000
    )
  );

}


function newTripTemplate(
  title='新しい旅行'
){

  const today=
    new Date()
    .toISOString()
    .slice(0,10);


  return {

    id:String(nid()),

    trip:{
      title,
      start:today,
      end:today,
      cities:'',
      budget:0,
      currency:'EUR'
    },

    itinerary:[],

    bookings:[],

    expenses:[],

    packing:[],

    notes:[]

  };

}


function defaultWorkspace(){

    );

    },

    {

      date:'2026-09-20',
      time:'18:00',
      type:'hotel',
      title:'ホテル チェックイン',
      place:'Rome',
      note:''
    },

    {
      id:nid(),
      date:'2026-09-21',
      time:'09:30',
      type:'sight',
      title:'コロッセオ',
      place:'Rome',
      note:'予約時間を確認'
    }

  ];


  t.bookings=[

    {
      id:nid(),
      type:'flight',
      title:'往復航空券',
      provider:'航空会社',
      code:'ABC123',
      price:160000,
      paid:true,
      status:'予約済み',
      link:''
    },

    {
      id:nid(),
      type:'hotel',
      title:'ローマ ホテル',
      provider:'Booking',
      code:'HTL001',
      price:52000,
      paid:true,
      status:'予約済み',
      link:''
    }

  ];


  t.expenses=[

    {
      id:nid(),
      date:'2026-08-01',
      category:'航空券',
      title:'往復航空券',
      amount:160000,
      paid:true
    },

    {
      id:nid(),
      date:'2026-08-05',
      category:'ホテル',
      title:'ローマ ホテル',
      amount:52000,
      paid:true
    }

  ];


  t.packing=[

    {
      id:nid(),
      title:'パスポート',
      checked:false,
      category:'重要'
    },

    {
      id:nid(),
      title:'クレジットカード',
      checked:false,
      category:'重要'
    },

    {
      id:nid(),
      title:'充電器・変換プラグ',
      checked:false,
      category:'電子機器'
    }

  ];


  t.notes=[

    {
      id:nid(),
      title:'旅行前に確認',
      body:'海外旅行保険、eSIM、空港までの移動を確認',
      date:'2026-09-01'
    }

  ];


  return {

    version:3,

    activeTripId:t.id,

    trips:[t]

  };

}


function migrateOld(){

  try{

    const old=
      JSON.parse(
        localStorage.getItem(
          OLD_KEY
        ) || 'null'
      );


    if(
      old &&
      old.trip
    ){

      const t={
        id:String(nid()),
        ...old
      };


      return {

        version:3,

        activeTripId:t.id,

        trips:[t]

      };

    }

  }catch(e){}


  return null;

}


function loadWorkspace(){

  try{

    const w=
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || 'null'
      );


    if(
      w?.trips?.length
    ){

      return w;

    }

  }catch(e){}


  return (
    migrateOld() ||
    defaultWorkspace()
  );

}


let workspace=
  loadWorkspace();


function activeTrip(){

  let t=
    workspace.trips.find(
      x=>
        x.id===
        workspace.activeTripId
    );


  if(!t){

    t=
      workspace.trips[0];

    workspace.activeTripId=
      t.id;

  }


  return t;

}


function saveLocal(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(
      workspace
    )
  );

  renderAll();

}


function save(){

  saveLocal();

  clearTimeout(
    saveTimer
  );

  saveTimer=
    setTimeout(
      ()=>cloudSave(),
      250
    );

}


/* =========================
   同期
========================= */

const hashParams=
  new URLSearchParams(
    location.hash.replace(
      /^#/,
      ''
    )
  );


function randomToken(
  bytes=18
){

  const a=
    new Uint8Array(
      bytes
    );


  crypto.getRandomValues(
    a
  );


  return Array.from(
    a,
    b=>
      b.toString(16)
      .padStart(2,'0')
  ).join('');

}


function loadSavedCredentials(){

  try{

    return JSON.parse(
      localStorage.getItem(
        SYNC_CREDENTIALS_KEY
      )
    ) || {};

  }catch(e){

    return {};

  }

}


function saveCredentials(
  tripId,
  key
){

  try{

    localStorage.setItem(
      SYNC_CREDENTIALS_KEY,
      JSON.stringify({
        tripId,
        key
      })
    );

  }catch(e){}

}


function isStandalone(){

  return (

    window.matchMedia(
      '(display-mode: standalone)'
    ).matches

    ||

    window.navigator.standalone===
    true

  );

}


function parseSharedLink(
  value
){

  try{

    const u=
      new URL(
        String(
          value||''
        ).trim(),
        location.origin
      );


    const p=
      new URLSearchParams(
        u.hash.replace(
          /^#/,
          ''
        )
      );


    const trip=
      p.get('trip');

    const key=
      p.get('key');


    if(

      /^[a-f0-9]{16,64}$/i
      .test(
        trip||''
      )

      &&

      /^[a-f0-9]{32,128}$/i
      .test(
        key||''
      )

    ){

      return {
        tripId:trip,
        key
      };

    }

  }catch(e){}


  return null;

}


function connectWithSharedLink(){

  const value=
    prompt(
      'Safariで同期できているTripNoteの「共有リンク」を貼り付けてください。'
    );


  if(
    value===null
  ){

    return false;

  }


  const c=
    parseSharedLink(
      value
    );


  if(!c){

    alert(
      '共有リンクを確認できませんでした。'
    );

    return false;

  }


  saveCredentials(
    c.tripId,
    c.key
  );


  location.replace(

    location.pathname+
    location.search+
    '#trip='+
    encodeURIComponent(
      c.tripId
    )+
    '&key='+
    encodeURIComponent(
      c.key
    )

  );


  return true;

}


const hashTrip=
  hashParams.get(
    'trip'
  );

const hashKey=
  hashParams.get(
    'key'
  );


let savedCredentials=
  loadSavedCredentials();


if(
  hashTrip &&
  hashKey
){

  saveCredentials(
    hashTrip,
    hashKey
  );

}


if(

  isStandalone()

  &&

  !hashTrip

  &&

  !hashKey

  &&

  !savedCredentials.tripId

){

  connectWithSharedLink();

  savedCredentials=
    loadSavedCredentials();

}


let TRIP_ID=

  (
    hashTrip &&
    hashKey

    ?

    hashTrip

    :

    savedCredentials.tripId
  )

  ||

  randomToken(8);


let EDIT_KEY=

  (
    hashTrip &&
    hashKey

    ?

    hashKey

    :

    savedCredentials.key
  )

  ||

  randomToken(24);


saveCredentials(
  TRIP_ID,
  EDIT_KEY
);


if(
  !hashTrip ||
  !hashKey
){

  history.replaceState(

    null,

    '',

    location.pathname+
    location.search+
    '#trip='+
    encodeURIComponent(
      TRIP_ID
    )+
    '&key='+
    encodeURIComponent(
      EDIT_KEY
    )

  );

}


let lastRemoteUpdatedAt=
  null;

let syncBusy=
  false;

let saveTimer=
  null;


function setSync(
  status,
  text
){

  syncDot.className=
    'syncdot '+
    (status||'');

  syncText.textContent=
    text;

}


async function api(
  action,
  payload={}
){

  const r=
    await fetch(

      '/api/trip',

      {

        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:
          JSON.stringify({
            action,
            tripId:TRIP_ID,
            key:EDIT_KEY,
            ...payload
          })

      }

    );


  const j=
    await r.json()
    .catch(
      ()=>({})
    );


  if(!r.ok){

    throw new Error(
      j.error ||
      '同期に失敗しました'
    );

  }


  return j;

}


async function cloudLoad(
  silent=false
){

  if(syncBusy){
    return;
  }


  syncBusy=
    true;


  if(!silent){

    setSync(
      'busy',
      '同期中…'
    );

  }


  try{

    const j=
      await api(
        'load'
      );


    if(
      j.exists &&
      j.data
    ){

      if(

        !lastRemoteUpdatedAt

        ||

        j.updatedAt !==
        lastRemoteUpdatedAt

      ){

        const remote=
          j.data;


        if(
          remote?.trips?.length
        ){

          workspace=
            remote;

        }

        else if(
          remote?.trip
        ){

          const t={
            id:String(nid()),
            ...remote
          };


          workspace={

            version:3,

            activeTripId:t.id,

            trips:[t]

          };

        }


        lastRemoteUpdatedAt=
          j.updatedAt;


        saveLocal();

      }

    }

    else{

      const c=
        await api(
          'save',
          {
            data:workspace
          }
        );


      lastRemoteUpdatedAt=
        c.updatedAt;

    }


    setSync(
      'ok',
      '同期済み'
    );

  }

  catch(e){

    console.error(e);

    setSync(
      'err',
      'オフライン'
    );

  }

  finally{

    syncBusy=
      false;

  }

}


async function cloudSave(){

  if(syncBusy){

    saveTimer=
      setTimeout(
        ()=>cloudSave(),
        500
      );

    return;

  }


  syncBusy=
    true;


  setSync(
    'busy',
    '保存中…'
  );


  try{

    const j=
      await api(
        'save',
        {
          data:workspace
        }
      );


    lastRemoteUpdatedAt=
      j.updatedAt;


    setSync(

  }

  catch(e){

    console.error(e);

    setSync(
      'err',

    );

}

/* =========================
   共通
========================= */

function esc(s){

  return String(
    s??''
  )
  .replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


function yen(v){

  return (
    '¥'+
    Number(
      v||0
    )
    .toLocaleString(
      'ja-JP'
    )
  );

}


function fmtDate(s){

  if(!s){
    return '';
  }


  const d=
    new Date(
      s+
      'T00:00:00'
    );


  return (
    `${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`
  );

}


function daysUntil(t){

  const n=
    new Date();


  n.setHours(
    0,0,0,0
  );


  const s=
    new Date(
      t.trip.start+
      'T00:00:00'
    );


  return Math.ceil(
    (s-n)/
    86400000
  );

}


function typeIcon(t){

  return {

    flight:'✈️',
    train:'🚆',
    hotel:'🏨',
    food:'🍽️',
    sight:'📍',
    transfer:'🚕',
    other:'•'

  }[t] || '•';

}


function expenseIcon(c){

  return {

    '航空券':'✈️',
    'ホテル':'🏨',
    '交通':'🚆',
    '食事':'🍽️',
    '観光':'🎟️',
    '買い物':'🛍️',
    'その他':'•'

  }[c] || '¥';

}


function totalExpenses(t){

  return t.expenses
  .reduce(

    (a,b)=>
      a+
      Number(
        b.amount||0
      ),

    0

  );

}


function paidExpenses(t){

  return t.expenses
  .filter(
    x=>x.paid
  )
  .reduce(

    (a,b)=>
      a+
      Number(
        b.amount||0
      ),

    0

  );

}

function field(
  l,
  n,
  t='text',
  v='',
  full=false
){

  return `

  <div
    class="field ${full?'full':''}">

    <label>
      ${l}
    </label>

    <input
      name="${n}"
      type="${t}"
      value="${esc(v)}"
    >

  </div>

  `;

}


function sel(
  l,
  n,
  ops,
  v,
  full=false
){

  return `

  <div
    class="field ${full?'full':''}">

    <label>
      ${l}
    </label>

    <select name="${n}">

      ${
      ops.map(
        o=>`

        <option
          ${o===v?'selected':''}>

          ${esc(o)}

        </option>

        `
      )
      .join('')
      }

    </select>

  </div>

  `;

}


function formWrap(
  title,
  inner,
  saveFn,
  delFn
){

  openSheet(`

  <div class="sht">
    ${title}
  </div>


  <form id="editForm">

    <div class="grid">
      ${inner}
    </div>


    <div class="actions">

      ${
      delFn
      ?

      '<button type="button" class="btn danger" id="delBtn">削除</button>'

      :

      ''
      }


      <button
        type="button"
        class="btn secondary"
        onclick="closeSheet()">

        キャンセル

      </button>


      <button
        class="btn primary">

        保存

      </button>

    </div>

  </form>

  `);


  const f=
    document.getElementById(
      'editForm'
    );


  f.onsubmit=
    e=>{

      e.preventDefault();


      saveFn(
        new FormData(f)
      );


      closeSheet();

      save();

    };


  if(delFn){

    document
    .getElementById(
      'delBtn'
    )
    .onclick=
      ()=>{

        if(
          confirm(
            '削除しますか？'
          )
        ){

          delFn();

          closeSheet();

          save();

        }

      };

  }

}

function editTrip(){

  const t=
    activeTrip();


  const x=
    t.trip;


  formWrap(

    '旅行設定',

    field(
      '旅行名',
      'title',
      'text',
      x.title,
      true
    )

    +

    field(
      '出発日',
      'start',

      x.start
    )

    +

    field(
      '帰国日',
      'end',
      'date',
      x.end
    )

    +

    field(
      '都市・行き先',
      'cities',
      'text',
      x.cities,
      true
    )

    +

    field(
      '旅行予算（円）',
      'budget',
      'number',
      x.budget
    )

    +

    field(
      '現地通貨',
      'currency',

    ),


    fd=>{

      t.trip={

        ...x,

        title:
          fd.get(

          fd.get(

function openTripList(){

  const now=
    new Date()
    .toISOString()
    .slice(
      0,
      10
    );


  openSheet(`

  <div class="sht">
    旅行一覧
  </div>


  <div class="card list">

    ${
    workspace.trips
    .slice()
    .sort(
      (a,b)=>
        a.trip.start
        .localeCompare(
          b.trip.start
        )
    )
    .map(
      t=>`

      <div
        class="item trip-card"
        onclick="selectTrip('${esc(t.id)}')">

        <div class="lico">
          🧳
        </div>

        <div class="main">

          <div class="it">
            ${esc(t.trip.title)}
          </div>

          <div class="trip-date">

            ${fmtDate(t.trip.start)}
            -
            ${fmtDate(t.trip.end)}

            ${
            t.trip.cities
            ?
            ' ・ '+esc(t.trip.cities)
            :
            ''
            }

          </div>

        </div>

        <div class="trip-badge">

          ${
          t.trip.end<now
          ?
          '過去'
          :
          t.trip.start>now
          ?
          '予定'
          :
          '旅行中'
          }

        </div>

      </div>

      `
    )
    .join('')
    }

  </div>


  <div class="actions">

    <button
      class="btn primary"
      onclick="createTrip()">

      ＋ 新しい旅行

    </button>

  </div>


  <div class="actions">

    <button
      class="btn secondary"
      onclick="closeSheet()">

      閉じる

    </button>

  </div>

  `);

}


function selectTrip(id){

  workspace.activeTripId=
    id;


  closeSheet();

  saveLocal();

  switchView(
    'home'
  );

}


function createTrip(){

  const t=
    newTripTemplate(
      '新しい旅行'
    );


  workspace.trips.push(
    t
  );


  workspace.activeTripId=
    t.id;


  closeSheet();

  save();

  editTrip();

}


function duplicateTrip(){

  const src=
    clone(
      activeTrip()
    );


  const copy=
    clone(
      src
    );


  copy.id=
    String(
      nid()
    );


  copy.trip.title=
    src.trip.title+
    '（コピー）';


  const remap=
    a=>
      a.map(
        x=>({
          ...x,
          id:nid()
        })
      );


  copy.itinerary=
    remap(
      copy.itinerary
    );


  copy.bookings=
    remap(
      copy.bookings
    );


  copy.expenses=
    remap(
      copy.expenses
    );


  copy.packing=
    remap(
      copy.packing
    );


  copy.notes=
    remap(
      copy.notes
    );


  workspace.trips.push(
    copy
  );


  workspace.activeTripId=
    copy.id;


  save();

  closeSheet();

}


function deleteCurrentTrip(){

  if(
    workspace.trips.length===
    1
  ){

    alert(
      '旅行は最低1件必要です'
    );

    return;

  }


  const t=
    activeTrip();


  if(
    !confirm(
      `「${t.trip.title}」を削除しますか？`
    )
  ){

    return;

  }


  workspace.trips=
    workspace.trips.filter(
      x=>x.id!==t.id
    );


  workspace.activeTripId=
    workspace.trips[0].id;


  save();

  closeSheet();

}
