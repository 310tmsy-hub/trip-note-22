<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">

<title>TripNote</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f6f8;
  color:#181818;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.auth-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:28px;
  box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.logo{
  font-size:32px;
  font-weight:800;
  margin-bottom:4px;
}

.auth-sub{
  color:#777;
  margin-bottom:24px;
}

.auth-switch{
  margin-top:20px;
  text-align:center;
  font-size:14px;
}

.link-button{
  border:0;
  background:none;
  color:#0066cc;
  font-weight:700;
  padding:8px;
}

.message{
  margin-top:14px;
  font-size:13px;
  line-height:1.6;
}

.error{color:#c62828}
.success{color:#2e7d32}

.field{margin-bottom:14px}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:12px;
  padding:12px;
  background:#fff;
}

.primary{
  border:0;
  border-radius:14px;
  padding:13px 18px;
  background:#111;
  color:#fff;
  font-weight:700;
}

.primary.full{width:100%}

.secondary{
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:10px 14px;
}

.danger{
  border:1px solid #ffd0d0;
  background:#fff5f5;
  color:#c62828;
  border-radius:12px;
  padding:10px 14px;
}

.small-action{
  border:1px solid #ddd;
  background:#fff;
  color:#333;
  border-radius:8px;
  padding:5px 9px;
  font-size:11px;
  font-weight:700;
}

.small-delete{
  border:1px solid #ffd2d2;
  background:#fff7f7;
  color:#c62828;
  border-radius:8px;
  padding:5px 9px;
  font-size:11px;
  font-weight:700;
}

.muted{
  color:#777;
  font-size:13px;
}

.small{font-size:12px}

.app{
  max-width:760px;
  margin:auto;
  min-height:100vh;
  background:#f5f6f8;
  padding-bottom:90px;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  padding:max(14px,env(safe-area-inset-top)) 16px 14px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:8px;
}

.brand{
  font-weight:800;
  font-size:20px;
  flex:1;
}

.user-pill{
  font-size:11px;
  background:#f1f1f1;
  padding:7px 9px;
  border-radius:999px;
  max-width:140px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.logout-button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:7px 9px;
  font-size:12px;
}

main{padding:16px}

.top-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.top-row select{
  flex:1;
  min-width:0;
  padding:12px;
  border:1px solid #ddd;
  border-radius:14px;
  background:#fff;
}

.hero{
  background:#111;
  color:#fff;
  border-radius:22px;
  padding:22px;
  margin-bottom:16px;
}

.hero h2{
  margin:0 0 6px;
  font-size:25px;
}

.hero .meta{
  opacity:.75;
  font-size:14px;
  margin-top:3px;
}

.hero .budget{
  margin-top:18px;
  font-size:12px;
  opacity:.7;
}

.hero .budget-value{
  font-size:28px;
  font-weight:800;
  margin-top:2px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
}

.card h3{
  margin:0 0 12px;
}

.row{
  display:flex;
  align-items:center;
  gap:10px;
}

.between{justify-content:space-between}

.badge{
  display:inline-block;
  font-size:11px;
  border-radius:999px;
  padding:5px 8px;
  background:#eee;
}

.badge.owner{
  background:#e7f2ff;
  color:#1565c0;
}

.badge.editor{
  background:#e9f8ee;
  color:#2e7d32;
}

.badge.viewer{
  background:#f3f3f3;
  color:#555;
}

.admin-note{
  padding:10px 12px;
  background:#eef6ff;
  border-radius:12px;
  font-size:12px;
  color:#1565c0;
  margin-bottom:12px;
}

.tabs{
  display:flex;
  overflow:auto;
  gap:7px;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{display:none}

.tab{
  white-space:nowrap;
  border:1px solid #ddd;
  background:#fff;
  padding:9px 12px;
  border-radius:999px;
}

.tab.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.item{
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.item:last-child{
  border-bottom:0;
}

.item-title{
  font-weight:700;
  line-height:1.5;
}

.item-actions{
  display:flex;
  justify-content:flex-end;
  gap:6px;
  margin-top:8px;
}

.empty{
  text-align:center;
  padding:40px 18px;
  color:#888;
}

/* ============================= */
/* 旅程 */
/* ============================= */

.itinerary-day{
  border-radius:20px;
  margin-bottom:16px;
  overflow:hidden;
}

.itinerary-color-0{
  background:#eef6ff;
}

.itinerary-color-1{
  background:#effaf2;
}

.itinerary-color-2{
  background:#fff7e8;
}

.itinerary-color-3{
  background:#f7efff;
}

.itinerary-color-4{
  background:#fff0f4;
}

.day-header{
  padding:14px 16px 10px;
  font-size:17px;
  font-weight:800;
}

.day-content{
  background:rgba(255,255,255,.75);
  margin:0 8px 8px;
  border-radius:15px;
  padding:0 13px;
}

.timeline-item{
  display:grid;
  grid-template-columns:62px 1fr;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid rgba(0,0,0,.07);
}

.timeline-item:last-child{
  border-bottom:0;
}

.timeline-time{
  font-size:15px;
  font-weight:800;
  color:#333;
}

.timeline-place{
  color:#666;
  font-size:13px;
  margin-top:4px;
}

.timeline-note{
  color:#777;
  font-size:12px;
  line-height:1.5;
  margin-top:5px;
}

.no-time{
  color:#aaa;
}

.fab{
  position:fixed;
  right:max(18px,calc((100vw - 760px)/2 + 18px));
  bottom:max(22px,env(safe-area-inset-bottom));
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:#111;
  color:#fff;
  font-size:26px;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
  z-index:30;
}

.modal-wrap{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.38);
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  background:#fff;
  width:100%;
  max-width:760px;
  max-height:90vh;
  overflow:auto;
  border-radius:24px 24px 0 0;
  padding:20px 20px max(20px,env(safe-area-inset-bottom));
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}

.modal-head h3{margin:0}

.icon-btn{
  border:0;
  background:#f1f1f1;
  border-radius:50%;
  width:36px;
  height:36px;
}

.member{
  border:1px solid #eee;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
}

.member-name{
  font-weight:700;
  margin-bottom:2px;
}

.member-email{
  font-size:12px;
  color:#777;
  word-break:break-all;
}

.member-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.member-grid select{
  width:100%;
  padding:9px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.update-toast{
  position:fixed;
  left:50%;
  bottom:max(95px,calc(env(safe-area-inset-bottom) + 85px));
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:520px;
  background:#111;
  color:#fff;
  border-radius:18px;
  padding:14px;
  z-index:300;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.update-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.update-text{
  flex:1;
  font-size:13px;
  line-height:1.5;
}

.update-btn{
  border:0;
  background:#fff;
  color:#111;
  padding:9px 13px;
  border-radius:10px;
  font-weight:700;
  white-space:nowrap;
}

@media(max-width:500px){
  .user-pill{display:none}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="auth-screen">
  <div class="auth-card">

    <div class="logo">TripNote</div>
    <div class="auth-sub">旅行を、みんなで安全に管理。</div>

    <div class="field">
      <label>メールアドレス</label>
      <input id="loginEmail" type="email" autocomplete="email">
    </div>

    <div class="field">
      <label>パスワード</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
    </div>

    <button class="primary full" onclick="login()">
      ログイン
    </button>

    <div id="loginMessage" class="message error"></div>

    <div class="auth-switch">
      初めての方<br>
      <button class="link-button" onclick="showRegister()">
        新規登録する
      </button>
    </div>

  </div>
</div>

<!-- REGISTER -->
<div id="registerScreen" class="auth-screen hidden">
  <div class="auth-card">

    <div class="logo">TripNote</div>
    <div class="auth-sub">新しいアカウントを作成</div>

    <div class="field">
      <label>名前</label>
      <input id="registerName" type="text" autocomplete="name">
    </div>

    <div class="field">
      <label>メールアドレス</label>
      <input id="registerEmail" type="email" autocomplete="email">
    </div>

    <div class="field">
      <label>パスワード</label>
      <input id="registerPassword" type="password" autocomplete="new-password">
    </div>

    <div class="field">
      <label>パスワード確認</label>
      <input id="registerPassword2" type="password" autocomplete="new-password">
    </div>

    <button id="registerButton" class="primary full" onclick="register()">
      アカウントを作成
    </button>

    <div id="registerMessage" class="message"></div>

    <div class="auth-switch">
      <button class="link-button" onclick="showLogin()">
        ログインへ戻る
      </button>
    </div>

  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">

<header>
  <div class="brand">TripNote</div>
  <div id="userLabel" class="user-pill"></div>

  <button class="logout-button" onclick="logout()">
    ログアウト
  </button>
</header>

<main>

  <div class="top-row">

    <select id="tripSelect" onchange="changeTrip()"></select>

    <button class="secondary" onclick="openTripManager()">
      🧳
    </button>

    <button class="secondary" onclick="openSettings()">
      ⚙️
    </button>

  </div>

  <div id="noTrips" class="card empty hidden">
    <div style="font-size:34px">🧳</div>
    <h3>旅行がありません</h3>
    <p>新しい旅行を作成してください。</p>

    <button class="primary" onclick="openNewTrip()">
      ＋ 新しい旅行
    </button>
  </div>

  <div id="tripArea">

    <section id="hero" class="hero"></section>

    <div id="tabs" class="tabs">

      <button class="tab active" data-view="home" onclick="setView('home')">
        ホーム
      </button>

      <button class="tab" data-view="itinerary" onclick="setView('itinerary')">
        旅程
      </button>

      <button class="tab" data-view="bookings" onclick="setView('bookings')">
        予約
      </button>

      <button class="tab expense-tab" data-view="expenses" onclick="setView('expenses')">
        雑費
      </button>

      <button class="tab" data-view="packing" onclick="setView('packing')">
        持ち物
      </button>

      <button class="tab notes-tab" data-view="notes" onclick="setView('notes')">
        メモ
      </button>

    </div>

    <div id="content"></div>

  </div>

</main>

<button id="fab" class="fab" onclick="addCurrent()">
  ＋
</button>

</div>

<!-- MODAL -->
<div id="modalWrap" class="modal-wrap hidden" onclick="closeModalOutside(event)">
  <div id="modal" class="modal"></div>
</div>

<!-- UPDATE -->
<div id="updateToast" class="update-toast hidden">

  <div class="update-row">

    <div class="update-text">
      新しいバージョンがあります。
    </div>

    <button id="updateButton" class="update-btn">
      更新する
    </button>

  </div>

</div>

<script>

let client = null;
let me = null;
let profile = null;

let trips = [];
let activeTripId = null;
let activeTrip = null;
let activeMembership = null;

let currentView = 'home';

const $ = id => document.getElementById(id);

function esc(v=''){
  return String(v)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function money(n,currency='EUR'){

  try{

    return new Intl.NumberFormat(
      'ja-JP',
      {
        style:'currency',
        currency:currency || 'EUR',
        maximumFractionDigits:0
      }
    ).format(Number(n || 0));

  }catch{

    return Number(n || 0).toLocaleString()
      +
      ' '
      +
      (currency || '');

  }
}

/* ============================= */
/* DATE */
/* ============================= */

function formatJapaneseDate(dateString){

  if(!dateString){
    return '日付未設定';
  }

  const d =
    new Date(
      dateString + 'T00:00:00'
    );

  const weekdays =
    ['日','月','火','水','木','金','土'];

  return (
    `${d.getMonth()+1}月${d.getDate()}日（${weekdays[d.getDay()]}）`
  );
}

function formatTime(time){

  if(!time){
    return '';
  }

  return time.slice(0,5);
}

/* ============================= */
/* INIT */
/* ============================= */

async function init(){

  try{

    const response =
      await fetch(
        '/api/config',
        {
          cache:'no-store'
        }
      );

    const config =
      await response.json();

    client =
      window.supabase.createClient(
        config.supabaseUrl,
        config.supabaseAnonKey
      );

    const {
      data:{session}
    } =
      await client.auth.getSession();

    if(session){

      me = session.user;

      await afterLogin();

    }else{

      showLogin();

    }

    client.auth.onAuthStateChange(
      async(event)=>{

        if(event === 'SIGNED_OUT'){

          me = null;
          profile = null;

          showLogin();

        }

      }
    );

  }catch(error){

    console.error(error);

    $('loginMessage').textContent =
      'アプリ設定を読み込めませんでした。';

  }
}

/* ============================= */
/* AUTH */
/* ============================= */

function showLogin(){

  $('loginScreen').classList.remove('hidden');
  $('registerScreen').classList.add('hidden');
  $('app').classList.add('hidden');

}

function showRegister(){

  $('loginScreen').classList.add('hidden');
  $('registerScreen').classList.remove('hidden');
  $('app').classList.add('hidden');

}

async function login(){

  $('loginMessage').textContent = '';

  const email =
    $('loginEmail').value.trim();

  const password =
    $('loginPassword').value;

  if(!email || !password){

    $('loginMessage').textContent =
      'メールアドレスとパスワードを入力してください。';

    return;

  }

  const {data,error} =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    console.error(error);

    $('loginMessage').textContent =
      'メールアドレスまたはパスワードを確認してください。';

    return;

  }

  me = data.user;

  await afterLogin();

}

async function register(){

  const name =
    $('registerName').value.trim();

  const email =
    $('registerEmail').value.trim().toLowerCase();

  const password =
    $('registerPassword').value;

  const password2 =
    $('registerPassword2').value;

  const message =
    $('registerMessage');

  message.textContent = '';
  message.className = 'message';

  if(!name){

    message.classList.add('error');
    message.textContent = '名前を入力してください。';

    return;

  }

  if(password.length < 6){

    message.classList.add('error');
    message.textContent = 'パスワードは6文字以上にしてください。';

    return;

  }

  if(password !== password2){

    message.classList.add('error');
    message.textContent = '確認用パスワードが一致していません。';

    return;

  }

  const {data,error} =
    await client.auth.signUp({

      email,
      password,

      options:{
        data:{name}
      }

    });

  if(error){

    message.classList.add('error');
    message.textContent = '新規登録できませんでした。';

    return;

  }

  message.classList.add('success');

  if(data.session){

    me = data.user;
    await afterLogin();

  }else{

    message.textContent =
      '確認メールを送りました。メール内のリンクを開いてください。';

  }
}

async function logout(){

  await client.auth.signOut();

  location.reload();

}

/* ============================= */
/* LOGIN COMPLETE */
/* ============================= */

async function afterLogin(){

  const {data,error} =
    await client
      .from('profiles')
      .select('*')
      .eq('id',me.id)
      .maybeSingle();

  if(error || !data){

    console.error(error);

    alert('プロフィールを取得できませんでした。');

    return;

  }

  profile = data;

  $('userLabel').textContent =
    (profile.name || me.email)
    +
    (profile.is_admin ? '・管理者' : '');

  $('loginScreen').classList.add('hidden');
  $('registerScreen').classList.add('hidden');
  $('app').classList.remove('hidden');

  await loadTrips();

}

/* ============================= */
/* TRIPS */
/* ============================= */

async function loadTrips(){

  const {data,error} =
    await client
      .from('trips')
      .select('*')
      .order(
        'start_date',
        {
          ascending:true,
          nullsFirst:false
        }
      );

  if(error){

    console.error(error);
    alert('旅行一覧を取得できませんでした。');

    return;

  }

  trips = data || [];

  if(!trips.length){

    activeTripId = null;
    activeTrip = null;

    $('noTrips').classList.remove('hidden');
    $('tripArea').classList.add('hidden');
    $('fab').classList.add('hidden');
    $('tripSelect').innerHTML = '';

    return;

  }

  $('noTrips').classList.add('hidden');
  $('tripArea').classList.remove('hidden');
  $('fab').classList.remove('hidden');

  if(
    !activeTripId
    ||
    !trips.some(t=>t.id === activeTripId)
  ){

    activeTripId =
      trips[0].id;

  }

  renderTripSelector();

  await loadActiveTrip();

}

function renderTripSelector(){

  $('tripSelect').innerHTML =
    trips.map(t=>`

      <option
        value="${t.id}"
        ${t.id===activeTripId?'selected':''}
      >
        ${esc(t.title)}
      </option>

    `).join('');

}

async function changeTrip(){

  activeTripId =
    $('tripSelect').value;

  currentView = 'home';

  await loadActiveTrip();

}

async function loadActiveTrip(){

  activeTrip =
    trips.find(
      t => t.id === activeTripId
    );

  if(!activeTrip){
    return;
  }

  activeMembership = null;

  if(
    activeTrip.owner_id !== me.id
    &&
    !profile.is_admin
  ){

    const {data} =
      await client
        .from('trip_members')
        .select('*')
        .eq('trip_id',activeTrip.id)
        .eq('user_id',me.id)
        .maybeSingle();

    activeMembership =
      data || null;

  }

  renderHero();

  updateTabs();

  setView(currentView);

}

/* ============================= */
/* PERMISSIONS */
/* ============================= */

function isOwner(){

  return (
    profile?.is_admin
    ||
    activeTrip?.owner_id === me?.id
  );

}

function isActualOwner(){

  return (
    activeTrip?.owner_id === me?.id
  );

}

function canEdit(){

  return (
    isOwner()
    ||
    activeMembership?.role === 'editor'
  );

}

function updateTabs(){

  document
    .querySelectorAll('.expense-tab')
    .forEach(el=>
      el.classList.toggle(
        'hidden',
        !canSeeExpenses()
      )
    );

  document
    .querySelectorAll('.notes-tab')
    .forEach(el=>
      el.classList.toggle(
        'hidden',
        !canSeeNotes()
      )
    );

}

function setView(view){

  currentView = view;

  document
    .querySelectorAll('.tab')
    .forEach(tab=>{

      tab.classList.toggle(
        'active',
        tab.dataset.view === view
      );

    });

  if(view === 'home'){
    renderHome();
  }

  if(view === 'itinerary'){
    renderItinerary();
  }

  if(view === 'bookings'){
    renderTable('bookings');
  }

  if(view === 'expenses'){
    renderTable('expenses');
  }

  if(view === 'packing'){
    renderTable('packing');
  }

  if(view === 'notes'){
    renderTable('notes');
  }

}

async function renderItinerary(){

  $('content').innerHTML = `
    <div class="card">
      <div class="muted">
        読み込み中...
      </div>
    </div>
  `;

  const {data,error} =
    await client
      .from('itinerary')
      .select('*')
      .eq('trip_id',activeTripId)
      .order('event_date',{
        ascending:true,
        nullsFirst:false
      })
      .order('event_time',{
        ascending:true,
        nullsFirst:false
      });

  if(error){

    console.error(error);

    $('content').innerHTML =
      '<div class="card">読み込みに失敗しました。</div>';

    return;

  }

  const rows =
    data || [];

  if(!rows.length){

    $('content').innerHTML = `

      <div class="card empty">

        <h3>旅程</h3>

        <p>
          まだ予定が登録されていません。
        </p>

        ${
          canEdit()
          ? `
            <button
              class="primary"
              onclick="openAddModal('itinerary')"
            >
              ＋ 予定を追加
            </button>
          `
          : ''
        }

      </div>

    `;

    return;

  }

  const groups = {};

  rows.forEach(row=>{

    const key =
      row.event_date || 'no-date';

    if(!groups[key]){
      groups[key] = [];
    }

    groups[key].push(row);

  });

  let html = '';

  Object
    .entries(groups)
    .forEach(([date,items],index)=>{

      html += `

        <section
          class="
            itinerary-day
            itinerary-color-${index % 5}
          "
        >

          <div class="day-header">
            ${
              date === 'no-date'
              ? '日付未設定'
              : formatJapaneseDate(date)
            }
          </div>

          <div class="day-content">

            ${
              items.map(row=>`

                <div class="timeline-item">

                  <div
                    class="
                      timeline-time
                      ${row.event_time ? '' : 'no-time'}
                    "
                  >
                    ${
                      row.event_time
                      ? formatTime(row.event_time)
                      : '時間未定'
                    }
                  </div>

                  <div>

                    <div class="item-title">
                      ${esc(row.title)}
                    </div>

                    ${
                      row.place
                      ? `
                        <div class="timeline-place">
                          📍 ${esc(row.place)}
                        </div>
                      `
                      : ''
                    }

                    ${
                      row.note
                      ? `
                        <div class="timeline-note">
                          ${esc(row.note)}
                        </div>
                      `
                      : ''
                    }

                    ${
                      canEdit()
                      ? `
                        <div class="item-actions">

                          <button
                            class="small-action"
                            onclick="openEditRow('itinerary','${row.id}')"
                          >
                            編集
                          </button>

                          <button
                            class="small-delete"
                            onclick="deleteRow('itinerary','${row.id}')"
                          >
                            削除
                          </button>

                        </div>
                      `
                      : ''
                    }

                  </div>

                </div>

              `).join('')
            }

          </div>

        </section>

      `;

    });

  $('content').innerHTML =
    html;

}

function openModal(html){

  $('modal').innerHTML = html;

  $('modalWrap')
    .classList
    .remove('hidden');

}

function closeModal(){

  $('modalWrap')
    .classList
    .add('hidden');

}

function closeModalOutside(e){

  if(
    e.target.id === 'modalWrap'
  ){

    closeModal();

  }

}

function field(
  label,
  id,
  type='text',
  value=''
){

  return `

    <div class="field">

      <label>
        ${label}
      </label>

      <input
        id="${id}"
        type="${type}"
        value="${esc(value)}"
      >

    </div>

}

    <button

}

/* DELETE TRIP */
/* ============================= */

async function deleteTrip(){

  if(!activeTrip){
    return;
  }

  if(
    !profile?.is_admin
    &&
    activeTrip.owner_id !== me?.id
  ){

    alert(
      'この旅行を削除する権限がありません。'
    );

    return;

  }

  if(
    !confirm(
      `「${activeTrip.title}」を削除しますか？\n\n旅程・予約・費用・持ち物・メモも削除されます。`
    )
  ){
    return;
  }

  if(
    !confirm(
      '本当に削除しますか？\nこの操作は元に戻せません。'
    )
  ){
    return;
  }

  const {error} =
    await client
      .from('trips')
      .delete()
      .eq(
        'id',
        activeTrip.id
      );

  if(error){

    console.error(error);
    alert('旅行を削除できませんでした。');

    return;

  }

  closeModal();

  activeTripId = null;
  activeTrip = null;
  activeMembership = null;
  currentView = 'home';

  await loadTrips();

}

/* ============================= */
/* SETTINGS */
/* ============================= */

async function openSettings(){

  if(!activeTrip){
    return;
  }

  if(!profile.is_admin){

    openModal(`

      <div class="modal-head">

        <h3>
          旅行設定
        </h3>

        <button
          class="icon-btn"
          onclick="closeModal()"
        >
          ×
        </button>

      </div>

      ${
        isActualOwner()
        ? `

          <button
            class="primary full"
            onclick="openTripEdit()"
          >
            旅行情報を編集
          </button>

          <button
            class="danger"
            style="
              width:100%;
              margin-top:12px
            "
            onclick="deleteTrip()"
          >
            🗑 この旅行を削除
          </button>

        `
        : `

          <div class="card">
            この旅行は共有された旅行です。
          </div>

        `
      }

    `);

    return;

  }

  const {data:members,error} =
    await client
      .from('trip_members')
      .select('*')
      .eq(
        'trip_id',
        activeTripId
      );

  if(error){

    alert(
      '共有設定を取得できませんでした。'
    );

    return;

  }

  const memberProfiles = [];

  for(
    const member of members || []
  ){

    const {data:p} =
      await client
        .from('profiles')
        .select(
          'id,name,email'
        )
        .eq(
          'id',
          member.user_id
        )
        .maybeSingle();

    memberProfiles.push({

      ...member,

      profile:
        p || null

    });

  }

  openModal(`

    <div class="modal-head">

      <h3>
        旅行設定
      </h3>

      <button
        class="icon-btn"
        onclick="closeModal()"
      >
        ×
      </button>

    </div>

    <button
      class="secondary"
      style="
        width:100%;
        margin-bottom:10px
      "
      onclick="openTripEdit()"
    >
      旅行情報を編集
    </button>

    <button
      class="danger"
      style="
        width:100%;
        margin-bottom:10px
      "
      onclick="deleteTrip()"
    >
      🗑 この旅行を削除
    </button>

    <button
      class="primary"
      style="
        width:100%;
        margin-bottom:18px
      "
      onclick="openShareAdd()"
    >
      ＋ 共有相手を追加
    </button>

    <h3>
      共有中
    </h3>

    ${
      memberProfiles.length
      ?
      memberProfiles.map(m=>`

        <div class="member">

          <div class="member-name">
            ${esc(
              m.profile?.name
              ||
              'ユーザー'
            )}
          </div>

          <div class="member-email">
            ${esc(
              m.profile?.email
              ||
              ''
            )}
          </div>

          <div class="member-grid">

            <div>

              <div class="small">
                権限
              </div>

              <select
                id="role-${m.id}"
              >

                <option
                  value="viewer"
                  ${
                    m.role === 'viewer'
                    ? 'selected'
                    : ''
                  }
                >
                  閲覧のみ
                </option>

                <option
                  value="editor"
                  ${
                    m.role === 'editor'
                    ? 'selected'
                    : ''
                  }
                >
                  編集可能
                </option>

              </select>

            </div>

            <div>

              <div class="small">
                費用明細
              </div>

              <select
                id="expense-${m.id}"
              >

                <option
                  value="false"
                  ${
                    !m.can_view_expenses
                    ? 'selected'
                    : ''
                  }
                >
                  見せない
                </option>

                <option
                  value="true"
                  ${
                    m.can_view_expenses
                    ? 'selected'
                    : ''
                  }
                >
                  見せる
                </option>

              </select>

            </div>

          </div>

          <div style="margin-top:8px">

            <div class="small">
              メモ
            </div>

            <select
              id="notes-${m.id}"
              style="
                width:100%;
                padding:9px;
                border:1px solid #ddd;
                border-radius:10px;
              "
            >

              <option
                value="false"
                ${
                  !m.can_view_notes
                  ? 'selected'
                  : ''
                }
              >
                見せない
              </option>

              <option
                value="true"
                ${
                  m.can_view_notes
                  ? 'selected'
                  : ''
                }
              >
                見せる
              </option>

            </select>

          </div>

          <div
            class="row"
            style="margin-top:12px"
          >

            <button
              class="small-action"
              onclick="saveMember('${m.id}')"
            >
              保存
            </button>

            <button
              class="small-delete"
              onclick="removeMember('${m.id}')"
            >
              共有解除
            </button>

          </div>

        </div>

      `).join('')
      :
      `

        <div class="muted">
          まだ誰にも共有していません。
        </div>

      `
    }

  `);

}

async function addShareMember(){

  const email =
    $('shareEmail')
      .value
      .trim()
      .toLowerCase();

  const {
    data:userProfile,
    error
  } =
    await client
      .from('profiles')
      .select(
        'id,name,email'
      )
      .eq(
        'email',
        email
      )
      .maybeSingle();

  if(
    error
    ||
    !userProfile
  ){

    alert(
      'そのユーザーが見つかりません。先に新規登録してもらってください。'
    );

    return;

  }

  const {error:shareError} =
    await client
      .from('trip_members')
      .upsert({

        trip_id:
          activeTripId,

        user_id:
          userProfile.id,

        role:
          $('shareRole').value,

        can_view_expenses:
          $('shareExpenses').value === 'true',

        can_view_notes:
          $('shareNotes').value === 'true'

      },{
        onConflict:
          'trip_id,user_id'
      });

  if(shareError){

    console.error(shareError);

    alert(
      '共有できませんでした。'
    );

    return;

  }

  alert(
    '共有しました。'
  );

  closeModal();

}

async function saveMember(id){

  const {error} =
    await client
      .from('trip_members')
      .update({

        role:
          $(`role-${id}`).value,

        can_view_expenses:
          $(`expense-${id}`).value === 'true',

        can_view_notes:
          $(`notes-${id}`).value === 'true'

      })
      .eq(
        'id',
        id
      );

  if(error){

    alert(
      '保存できませんでした。'
    );

    return;

  }

  alert(
    '共有設定を保存しました。'
  );

}

async function removeMember(id){

  if(
    !confirm(
      '共有を解除しますか？'
    )
  ){
    return;
  }

  const {error} =
    await client
      .from('trip_members')
      .delete()
      .eq(
        'id',
        id
      );

  if(error){

    alert(
      '共有解除できませんでした。'
    );

    return;

  }

  closeModal();

  await openSettings();

}

/* ============================= */
/* PWA UPDATE */
/* ============================= */

let newWorker = null;
let refreshing = false;

function showUpdateToast(){

  $('updateToast')
    .classList
    .remove('hidden');

}

async function setupServiceWorker(){

  if(
    !('serviceWorker' in navigator)
  ){
    return;
  }

  try{

    const registration =
      await navigator
        .serviceWorker
        .register(
          '/sw.js',
          {
            updateViaCache:'none'
          }
        );

    registration.update();

    if(registration.waiting){

      newWorker =
        registration.waiting;

      showUpdateToast();

    }

    registration.addEventListener(
      'updatefound',
      ()=>{

        const worker =
          registration.installing;

        if(!worker){
          return;
        }

        worker.addEventListener(
          'statechange',
          ()=>{

            if(
              worker.state === 'installed'
              &&
              navigator.serviceWorker.controller
            ){

              newWorker =
                worker;

              showUpdateToast();

            }

          }
        );

      }
    );

    $('updateButton')
      .addEventListener(
        'click',
        ()=>{

          if(newWorker){

            newWorker.postMessage({
              type:'SKIP_WAITING'
            });

          }else{

            location.reload();

          }

        }
      );

    navigator
      .serviceWorker
      .addEventListener(
        'controllerchange',
        ()=>{

          if(refreshing){
            return;
          }

          refreshing = true;

          location.reload();

        }
      );

    document.addEventListener(
      'visibilitychange',
      ()=>{

        if(
          document.visibilityState === 'visible'
        ){

          registration.update();

        }

      }
    );

  }catch(error){

    console.error(error);

  }

}

init();
