<script>
const SYNC_CREDENTIALS_KEY='tripnote_sync_credentials_v2';

const hashParams=new URLSearchParams(location.hash.replace(/^#/,''));

function randomToken(bytes=18){
  const a=new Uint8Array(bytes);
  crypto.getRandomValues(a);

  return Array.from(
    a,
    b=>b.toString(16).padStart(2,'0')
  ).join('');
}

function loadSavedCredentials(){
  try{
    return JSON.parse(
      localStorage.getItem(SYNC_CREDENTIALS_KEY)
    ) || {};
  }catch(e){
    return {};
  }
}

function saveCredentials(tripId,key){
  try{
    localStorage.setItem(
      SYNC_CREDENTIALS_KEY,
      JSON.stringify({
        tripId,
        key
      })
    );
  }catch(e){}
}

function isStandalone(){
  return (
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true
  );
}

function parseSharedLink(value){
  try{

    const u=new URL(
      String(value||'').trim(),
      location.origin
    );

    const p=new URLSearchParams(
      u.hash.replace(/^#/,'')
    );

    const trip=p.get('trip');
    const key=p.get('key');

    if(
      /^[a-f0-9]{16,64}$/i.test(trip||'') &&
      /^[a-f0-9]{32,128}$/i.test(key||'')
    ){
      return {
        tripId:trip,
        key:key
      };
    }

  }catch(e){}

  return null;
}

function connectWithSharedLink(){

  const value=prompt(
`Safariで同期できているTripNoteの
「共有リンク」を貼り付けてください。

例：
https://trip-note-22.vercel.app/#trip=...&key=...`
  );

  if(value===null){
    return false;
  }

  const c=parseSharedLink(value);

  if(!c){

    alert(
      '共有リンクを確認できませんでした。\n\nSafariのTripNoteで「共有リンクをコピー」して、もう一度貼り付けてください。'
    );

    return false;
  }

  saveCredentials(
    c.tripId,
    c.key
  );

  location.replace(
    location.pathname+
    location.search+
    '#trip='+
    encodeURIComponent(c.tripId)+
    '&key='+
    encodeURIComponent(c.key)
  );

  return true;
}


const hashTrip=hashParams.get('trip');
const hashKey=hashParams.get('key');

let savedCredentials=loadSavedCredentials();


/* Safariの共有URLから開いた場合 */

if(hashTrip && hashKey){

  saveCredentials(
    hashTrip,
    hashKey
  );

}


/* ホーム画面アプリで初回起動した場合 */

if(
  isStandalone() &&
  !hashTrip &&
  !hashKey &&
  !savedCredentials.tripId
){

  connectWithSharedLink();

  savedCredentials=
    loadSavedCredentials();

}


/* 同期ID */

let TRIP_ID=
  (
    hashTrip &&
    hashKey
      ? hashTrip
      : savedCredentials.tripId
  )
  ||
  randomToken(8);


/* 編集キー */

let EDIT_KEY=
  (
    hashTrip &&
    hashKey
      ? hashKey
      : savedCredentials.key
  )
  ||
  randomToken(24);


let lastRemoteUpdatedAt=null;

let syncBusy=false;

let saveTimer=null;


/* この端末に同期情報を保存 */

saveCredentials(
  TRIP_ID,
  EDIT_KEY
);


/* URLにtripとkeyが無ければ追加 */

if(
  !hashTrip ||
  !hashKey
){

  history.replaceState(
    null,
    '',
    location.pathname+
    location.search+
    '#trip='+
    encodeURIComponent(TRIP_ID)+
    '&key='+
    encodeURIComponent(EDIT_KEY)
  );

}


function setSync(status,text){

  const d=
    document.getElementById('syncDot');

  const t=
    document.getElementById('syncText');

  if(!d || !t){
    return;
  }

  d.className=
    'syncdot '+(status||'');

  t.textContent=text;
}


function localSave(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  renderAll();

}


function save(){

  localSave();

  clearTimeout(saveTimer);

  saveTimer=setTimeout(
    ()=>cloudSave(),
    250
  );

}


async function api(
  action,
  payload={}
){

  const r=
    await fetch(
      '/api/trip',
      {
        method:'POST',

        headers:{
          'Content-Type':
            'application/json'
        },

        body:JSON.stringify({
          action,
          tripId:TRIP_ID,
          key:EDIT_KEY,
          ...payload
        })
      }
    );


  const j=
    await r.json()
    .catch(()=>({}));


  if(!r.ok){

    throw new Error(
      j.error ||
      '同期に失敗しました'
    );

  }


  return j;

}


async function cloudLoad(
  silent=false
){

  if(syncBusy){
    return;
  }


  syncBusy=true;


  if(!silent){

    setSync(
      'busy',
      '同期中…'
    );

  }


  try{

    const j=
      await api(
        'load'
      );


    if(
      j.exists &&
      j.data
    ){

      if(
        !lastRemoteUpdatedAt ||
        j.updatedAt !== lastRemoteUpdatedAt
      ){

        data=j.data;

        lastRemoteUpdatedAt=
          j.updatedAt;

        localSave();

      }

    }else{

      const c=
        await api(
          'save',
          {data}
        );

      lastRemoteUpdatedAt=
        c.updatedAt;

    }


    setSync(
      'ok',
      '同期済み'
    );


  }catch(e){

    console.error(e);

    setSync(
      'err',
      'オフライン'
    );

  }finally{

    syncBusy=false;

  }

}


async function cloudSave(){

  if(syncBusy){

    saveTimer=
      setTimeout(
        ()=>cloudSave(),
        500
      );

    return;

  }


  syncBusy=true;


  setSync(
    'busy',
    '保存中…'
  );


  try{

    const j=
      await api(
        'save',
        {data}
      );


    lastRemoteUpdatedAt=
      j.updatedAt;


    setSync(
      'ok',
      '同期済み'
    );


  }catch(e){

    console.error(e);

    setSync(
      'err',
      '未同期'
    );

  }finally{

    syncBusy=false;

  }

}


async function syncNow(){

  await cloudLoad(false);

}


function shareUrl(){

  return (
    location.origin+
    location.pathname+
    location.search+
    '#trip='+
    encodeURIComponent(TRIP_ID)+
    '&key='+
    encodeURIComponent(EDIT_KEY)
  );

}


async function copyShareLink(){

  try{

    await navigator.clipboard.writeText(
      shareUrl()
    );

    alert(
      '共有リンクをコピーしました'
    );

  }catch(e){

    prompt(
      'このURLを共有してください',
      shareUrl()
    );

  }

}
</script>
